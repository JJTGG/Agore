name: Agoré CI

on:
  push:
    branches:
      - main
      - JJTGG-patch-1
      - JJTGG-patch-2
  pull_request:
    branches:
      - main
      - JJTGG-patch-1
      - JJTGG-patch-2
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agore-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Tests, typecheck, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run regression tests
        run: npm test

      - name: Check TypeScript
        run: npm run typecheck

      - name: Build production application
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-not-a-real-key
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-not-a-real-service-role-key